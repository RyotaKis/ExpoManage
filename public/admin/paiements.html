<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paiements · Administration</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <main class="container wide stack">
    <h1>Paiements</h1>
    <div class="onglets" role="tablist">
      <button role="tab" aria-selected="true" data-onglet="attente">À valider</button>
      <button role="tab" aria-selected="false" data-onglet="historique">Historique des versements</button>
    </div>

    <section id="attente" class="stack"></section>

    <section id="historique" class="stack" hidden>
      <div class="filtres">
        <label>Édition <select id="edition"></select></label>
        <label>Statut <select id="statut">
          <option value="">Tous</option><option value="valide">Validés</option>
          <option value="en_attente">En attente</option><option value="rejete">Rejetés</option></select></label>
        <div id="export"></div>
      </div>
      <div id="liste"></div>
    </section>
    <p class="small muted">Pour enregistrer un paiement reçu directement (espèces, etc.), ouvrez la demande concernée depuis l'onglet <a href="/admin/demandes.html">Demandes</a>.</p>
  </main>

  <script type="module">
    import * as api from '/assets/js/api.js';
    import { exigerAdmin, rafraichirCompteurs } from '/assets/js/layout.js';
    import { selecteurEdition } from '/assets/js/admin-commun.js';
    import { $, $$, esc, fcfa, date, dateHeure, badge, LIBELLES, dialogue, toast, boutonsExport, brancherExport, exporter, afficherTelephone } from '/assets/js/ui.js';

    await exigerAdmin();

    $$('[data-onglet]').forEach((b) => b.addEventListener('click', () => {
      $$('[data-onglet]').forEach((x) => x.setAttribute('aria-selected', x === b));
      $('#attente').hidden = b.dataset.onglet !== 'attente';
      $('#historique').hidden = b.dataset.onglet !== 'historique';
      if (b.dataset.onglet === 'historique') historique();
    }));

    async function apercu(chemin) {
      if (!chemin) return '<div class="alert">Aucun justificatif joint.</div>';
      const u = await api.urlFichier(chemin);
      if (!u) return '<div class="alert erreur">Justificatif introuvable.</div>';
      const blob = await fetch(u).then((r) => r.blob()).catch(() => null);
      return blob?.type === 'application/pdf'
        ? `<a class="btn secondary" href="${u}" target="_blank" rel="noopener">Ouvrir le PDF</a>`
        : `<a href="${u}" target="_blank" rel="noopener" title="Agrandir"><img class="justif" src="${u}" alt="Justificatif de paiement"></a>`;
    }

    async function attente() {
      const liste = await api.paiementsEnAttente();
      rafraichirCompteurs();
      if (!liste.length) { $('#attente').innerHTML = '<div class="card vide">Aucun paiement en attente de validation.</div>'; return; }
      const cartes = await Promise.all(liste.map(async (p) => `
        <article class="card attente-carte">
          <div>${await apercu(p.justificatif_path)}</div>
          <div class="stack">
            <div class="row between"><h3 style="margin:0">${fcfa(p.montant)}</h3>${badge('paiement', p.statut)}</div>
            <dl class="dl">
              <dt>Exposant</dt><dd>${esc(p.demande.entreprise)}<br><span class="muted small">${esc(p.demande.exposant_nom)} · ${esc(afficherTelephone(p.demande.telephone))}</span></dd>
              <dt>Demande</dt><dd><a href="/admin/demande.html?id=${p.demande_id}">${esc(p.demande.numero)}</a> · ${esc(p.demande.categorie_nom)} × ${p.demande.quantite}</dd>
              <dt>Date</dt><dd>${date(p.date_paiement)}</dd>
              <dt>Moyen</dt><dd>${esc(LIBELLES.moyen[p.moyen])}</dd>
              ${p.reference ? `<dt>Référence</dt><dd>${esc(p.reference)}</dd>` : ''}
              ${p.commentaire ? `<dt>Commentaire</dt><dd>${esc(p.commentaire)}</dd>` : ''}
              <dt>Déclaré le</dt><dd>${dateHeure(p.created_at)}</dd>
              <dt>Situation</dt><dd>Dû ${fcfa(p.demande.montant_du)} · déjà validé ${fcfa(p.demande.total_paye)}</dd>
            </dl>
            <div class="actions">
              <button class="btn ok" data-valider="${p.id}">Valider le paiement</button>
              <button class="btn danger" data-rejeter="${p.id}">Rejeter</button>
            </div>
            <p class="small muted" style="margin:0">Validez uniquement après avoir vérifié que la somme a bien été reçue.</p>
          </div>
        </article>`));
      $('#attente').innerHTML = cartes.join('');

      $$('[data-valider]').forEach((b) => b.addEventListener('click', async () => {
        b.disabled = true;
        try { await api.traiterPaiement(b.dataset.valider, 'valide'); toast('Paiement validé.', 'ok'); await attente(); }
        catch (e) { toast(e.message, 'erreur'); b.disabled = false; }
      }));
      $$('[data-rejeter]').forEach((b) => b.addEventListener('click', async () => {
        const ok = await dialogue({
          titre: 'Rejeter ce paiement', bouton: 'Rejeter', danger: true,
          corps: '<label>Motif du rejet <span class="hint">Visible par l\'exposant</span><textarea name="motif" rows="3" required></textarea></label>',
          soumettre: (f) => api.traiterPaiement(b.dataset.rejeter, 'rejete', f.motif.value),
        });
        if (ok) { toast('Paiement rejeté.'); await attente(); }
      }));
    }

    const sel = await selecteurEdition($('#edition'), { toutes: true, onChange: historique });
    $('#statut').addEventListener('change', historique);
    $('#export').innerHTML = boutonsExport();
    let lignes = [];
    brancherExport($('#export'), (format) => exporter('paiements', [
      ['Date paiement', (p) => p.date_paiement], ['N° demande', (p) => p.demande.numero], ['Entreprise', (p) => p.demande.entreprise],
      ['Exposant', (p) => p.demande.exposant_nom], ['Téléphone', (p) => p.demande.telephone], ['Catégorie', (p) => p.demande.categorie_nom],
      ['Montant', (p) => p.montant], ['Moyen', (p) => LIBELLES.moyen[p.moyen]], ['Référence', (p) => p.reference || ''],
      ['Origine', (p) => (p.origine === 'admin' ? 'Saisi par l\'administration' : 'Déclaré par l\'exposant')],
      ['Statut', (p) => LIBELLES.paiement[p.statut]], ['Motif rejet', (p) => p.motif_rejet || ''],
      ['Validé le', (p) => p.valide_le?.slice(0, 10) || ''],
    ], lignes, format));

    async function historique() {
      lignes = await api.listePaiements({ edition_id: sel.valeur(), statut: $('#statut').value });
      $('#liste').innerHTML = lignes.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Demande</th><th>Exposant</th><th>Moyen</th><th class="num">Montant</th><th>Statut</th><th>Origine</th></tr></thead>
        <tbody>${lignes.map((p) => `<tr class="lien" data-href="/admin/demande.html?id=${p.demande_id}">
          <td>${date(p.date_paiement)}</td><td>${esc(p.demande.numero)}</td>
          <td>${esc(p.demande.entreprise)}<br><span class="small muted">${esc(p.demande.exposant_nom)}</span></td>
          <td>${esc(LIBELLES.moyen[p.moyen])}</td><td class="num">${fcfa(p.montant)}</td>
          <td>${badge('paiement', p.statut)}</td><td class="small">${p.origine === 'admin' ? 'Admin' : 'Exposant'}</td></tr>`).join('')}
        </tbody>
        <tfoot><tr><th colspan="4">Total validé</th><th class="num">${fcfa(lignes.filter((p) => p.statut === 'valide').reduce((t, p) => t + p.montant, 0))}</th><th colspan="2"></th></tr></tfoot>
        </table></div>` : '<div class="card vide">Aucun versement.</div>';
      $$('#liste [data-href]').forEach((tr) => tr.addEventListener('click', () => (location.href = tr.dataset.href)));
    }

    await attente();
  </script>
</body>
</html>
