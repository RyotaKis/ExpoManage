<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration · Fènou HIGBÉ</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <main class="container narrow stack" style="padding-top:48px">
    <h1>Administration</h1>
    <form id="form" class="card form-grid" novalidate>
      <label>E-mail <input name="email" type="email" required autocomplete="username"></label>
      <label>Mot de passe <input name="mdp" type="password" required autocomplete="current-password"></label>
      <div id="erreur" class="alert erreur" hidden></div>
      <button class="btn block" type="submit">Se connecter</button>
    </form>
    <p class="small muted">Espace réservé à l'équipe organisatrice. Exposants : <a href="/connexion.html">connectez-vous ici</a>.</p>
  </main>

  <script type="module">
    import * as api from '/assets/js/api.js';
    import { $, param } from '/assets/js/ui.js';

    const retour = param('retour');
    const cible = retour && retour.startsWith('/admin/') ? retour : '/admin/';
    if (await api.monAdmin()) location.replace(cible);

    const form = $('#form'), erreur = $('#erreur');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      erreur.hidden = true;
      const b = form.querySelector('[type=submit]');
      b.disabled = true;
      try {
        await api.connexionAdmin(form.email.value, form.mdp.value);
        location.href = cible;
      } catch (err) {
        erreur.textContent = err.message; erreur.hidden = false; b.disabled = false;
      }
    });
  </script>
</body>
</html>
