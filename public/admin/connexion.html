<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration · Fenou Expo Manage</title>
  <meta name="theme-color" content="#0f0f11">
  <link rel="stylesheet" href="/assets/css/app.css">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fenou Expo">
  <script type="module" src="/assets/js/pwa.js"></script>
</head>
<body>
  <div class="auth">
    <section class="auth-visuel" id="visuel"></section>
    <section class="auth-form"><div>
      <h1>Administration</h1>
      <p class="sous-titre">Espace réservé à l'équipe organisatrice</p>
      <form id="form" class="form-grid" novalidate>
        <label>E-mail
          <span class="champ"><span data-ic="profil"></span><input name="email" type="email" required autocomplete="username"></span></label>
        <label>Mot de passe
          <span class="champ"><span data-ic="cadenas"></span><input name="mdp" type="password" required autocomplete="current-password"></span></label>
        <div id="erreur" class="alert erreur" hidden></div>
        <button class="btn block lg" type="submit">Se connecter <span data-ic="fleche"></span></button>
      </form>
      <p class="small muted" style="margin-top:24px">Vous êtes exposant ? <a class="lien-fort" href="/connexion.html">Connectez-vous ici</a>.</p>
    </div></section>
  </div>

  <script type="module">
    import * as api from '/assets/js/api.js';
    import { monterVisuel } from '/assets/js/auth-visuel.js';
    import { ic } from '/assets/js/icones.js';
    import { $, $$, param } from '/assets/js/ui.js';

    monterVisuel($('#visuel'), { admin: true });
    $$('[data-ic]').forEach((s) => (s.outerHTML = ic(s.dataset.ic)));
    const retour = param('retour');
    const cible = retour && retour.startsWith('/admin/') ? retour : '/admin/';
    if (await api.monAdmin()) location.replace(cible);

    const form = $('#form'), erreur = $('#erreur');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      erreur.hidden = true;
      const b = form.querySelector('[type=submit]');
      b.disabled = true;
      try {
        await api.connexionAdmin(form.email.value, form.mdp.value);
        location.href = cible;
      } catch (err) {
        erreur.textContent = err.message; erreur.hidden = false; b.disabled = false;
      }
    });
  </script>
</body>
</html>
