<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nouvelle demande · Fènou HIGBÉ</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <main class="container stack" style="max-width:820px">
    <h1>Nouvelle demande de stand</h1>
    <div id="zone"><p class="muted">Chargement…</p></div>
  </main>

  <script type="module">
    import * as api from '/assets/js/api.js';
    import { monterEntete, exigerExposant } from '/assets/js/layout.js';
    import { $, $$, esc, fcfa, date, rendreContrat, toast } from '/assets/js/ui.js';

    await exigerExposant();
    monterEntete('exposant');
    const zone = $('#zone');

    const [ed] = await api.editionsOuvertes();
    if (!ed) { zone.innerHTML = '<div class="alert">Les inscriptions ne sont pas ouvertes pour le moment.</div>'; throw 0; }
    const [tarifs, contrat] = await Promise.all([api.tarifsEnVigueur(ed.id), api.contratEnVigueur(ed.id)]);
    if (!tarifs.length || !contrat) { zone.innerHTML = '<div class="alert">Les demandes ne sont pas encore possibles pour cette édition.</div>'; throw 0; }

    const sites = ed.sites.filter((s) => tarifs.some((t) => t.site_id === s.id));
    const familles = [...new Set(tarifs.map((t) => t.famille_nom))];

    zone.innerHTML = `
      <form id="form" class="stack" novalidate>
        <p class="muted">${esc(ed.nom)} · du ${date(ed.date_debut)} au ${date(ed.date_fin)}.
          Une demande porte sur <strong>une seule catégorie</strong> de stand. Pour d'autres catégories, faites une autre demande.</p>

        ${sites.length > 1 ? `<fieldset class="stack"><legend>1. Site</legend><div class="choix">
          ${sites.map((s, i) => `<label><input type="radio" name="site" value="${s.id}" ${i ? '' : 'checked'}><strong>${esc(s.nom)}</strong></label>`).join('')}
        </div></fieldset>` : `<input type="hidden" name="site" value="${sites[0].id}">`}

        <fieldset class="stack">
          <legend>${sites.length > 1 ? '2' : '1'}. Catégorie de stand</legend>
          <div id="categories" class="stack"></div>
        </fieldset>

        <fieldset class="stack">
          <legend>${sites.length > 1 ? '3' : '2'}. Nombre de stands</legend>
          <div class="quantite">
            <button type="button" class="btn secondary" data-q="-1" aria-label="Un stand de moins">−</button>
            <input name="quantite" type="number" min="1" max="50" value="1" inputmode="numeric" aria-label="Nombre de stands">
            <button type="button" class="btn secondary" data-q="1" aria-label="Un stand de plus">+</button>
          </div>
          <label>Remarque pour l'organisation <span class="hint">Facultatif : besoins particuliers, préférences…</span>
            <textarea name="note" rows="2"></textarea></label>
        </fieldset>

        <div class="total" aria-live="polite"><span id="detail">Choisissez une catégorie</span><span class="value" id="total">—</span></div>

        <fieldset class="stack">
          <legend>${sites.length > 1 ? '4' : '3'}. Contrat d'exploitation des stands</legend>
          <p class="small muted">${esc(contrat.titre)} · version ${contrat.version}. Lisez-le jusqu'au bout avant de l'accepter.</p>
          <div class="contrat" id="contrat" tabindex="0">${rendreContrat(contrat.contenu)}</div>
          <label class="check"><input type="checkbox" name="accord" id="accord">
            <span>J'ai lu le contrat d'exploitation des stands (version ${contrat.version}) et j'en accepte toutes les conditions.</span></label>
        </fieldset>

        <button class="btn block" type="submit">Envoyer ma demande</button>
      </form>`;

    const form = $('#form');
    const siteCourant = () => form.site.value || form.querySelector('[name=site]:checked')?.value;

    function afficherCategories() {
      const site = siteCourant();
      const deja = form.querySelector('[name=categorie]:checked')?.value;
      $('#categories').innerHTML = familles.map((f) => {
        const liste = tarifs.filter((t) => t.site_id === site && t.famille_nom === f);
        return liste.length ? `<div><h3 class="small muted">${esc(f)}</h3><div class="choix">${liste.map((t) => `
          <label><input type="radio" name="categorie" value="${t.categorie_id}" data-prix="${t.prix_unitaire}"
            data-nom="${esc(t.categorie_nom)}" ${t.categorie_id === deja ? 'checked' : ''}>
            <strong>${esc(t.categorie_nom)}</strong>
            <span>${fcfa(t.prix_unitaire)} <span class="muted small">/ stand</span></span><br>
            <span class="muted small">${esc(t.libelle)} jusqu'au ${date(t.date_fin)}</span></label>`).join('')}</div></div>` : '';
      }).join('');
      calculer();
    }

    function calculer() {
      const c = form.querySelector('[name=categorie]:checked');
      const q = Math.max(1, parseInt(form.quantite.value, 10) || 1);
      if (!c) { $('#detail').textContent = 'Choisissez une catégorie'; $('#total').textContent = '—'; return; }
      $('#detail').textContent = `${q} × ${c.dataset.nom} à ${fcfa(c.dataset.prix)}`;
      $('#total').textContent = fcfa(q * Number(c.dataset.prix));
    }

    afficherCategories();
    form.addEventListener('change', (e) => (e.target.name === 'site' ? afficherCategories() : calculer()));
    form.quantite.addEventListener('input', calculer);
    $$('[data-q]').forEach((b) => b.addEventListener('click', () => {
      form.quantite.value = Math.min(50, Math.max(1, (parseInt(form.quantite.value, 10) || 1) + Number(b.dataset.q)));
      calculer();
    }));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const c = form.querySelector('[name=categorie]:checked');
      if (!c) return toast('Choisissez une catégorie de stand.', 'erreur');
      if (!$('#accord').checked) return toast('Vous devez accepter le contrat pour envoyer votre demande.', 'erreur');
      const bouton = form.querySelector('[type=submit]');
      bouton.disabled = true;
      try {
        const d = await api.creerDemande({
          edition_id: ed.id, site_id: siteCourant(), categorie_id: c.value,
          quantite: parseInt(form.quantite.value, 10), contrat_id: contrat.id, consentement: true, note: form.note.value,
        });
        location.href = `/espace/demande.html?id=${d.id}&nouvelle=1`;
      } catch (err) {
        toast(err.message, 'erreur');
        bouton.disabled = false;
      }
    });
  </script>
</body>
</html>
