<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réserver un stand · Fènou HIGBÉ</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fenou Expo">
  <script type="module" src="/assets/js/pwa.js"></script>
</head>
<body>
  <main class="container stack" style="max-width:860px">
    <div class="entete-page"><div><h1>Réserver un stand</h1><p>Quelques informations, votre stand, puis le contrat rempli à votre nom</p></div></div>
    <div id="zone"><p class="muted">Chargement…</p></div>
  </main>

  <script type="module">
    import * as api from '/assets/js/api.js';
    import { monterEntete, exigerExposant } from '/assets/js/layout.js';
    import { $, $$, esc, fcfa, date, toast, param, normaliserTelephone } from '/assets/js/ui.js';
    import { ic } from '/assets/js/icones.js';
    import { documentContrat, estModele } from '/assets/js/contrat.js';

    let profil = await exigerExposant();
    monterEntete('exposant');
    const zone = $('#zone');

    // Éditions ouvertes qui ont des tarifs en vigueur et un contrat publié
    const offres = [];
    for (const ed of await api.editionsOuvertes()) {
      const [tarifs, contrat] = await Promise.all([api.tarifsEnVigueur(ed.id), api.contratEnVigueur(ed.id)]);
      if (tarifs.length && contrat) offres.push({ ed, tarifs, contrat });
    }
    if (!offres.length) {
      zone.innerHTML = '<div class="card vide">' + ic('calendrier') + '<p>Aucune édition n\'est ouverte aux réservations pour le moment.</p></div>';
      throw 0;
    }

    const CHAMPS = [
      ['nom', 'Nom', true, 'family-name'], ['prenoms', 'Prénoms', true, 'given-name'],
      ['entreprise', 'Nom de l\'entreprise ou de l\'activité', true, 'organization'], ['ville', 'Ville', false, 'address-level2'],
      ['adresse', 'Adresse', false, 'street-address'], ['whatsapp', 'WhatsApp', false, 'tel'],
      ['email', 'E-mail', false, 'email'], ['ifu', 'IFU', false, ''], ['rccm', 'RCCM', false, ''],
    ];
    let offre = offres.find((o) => o.ed.id === param('edition')) || offres[0];

    zone.innerHTML = `
      <form id="form" class="stack" novalidate>
        ${offres.length > 1 ? `
        <fieldset class="stack"><legend><span class="etape-num">1</span> Pour quelle édition ?</legend>
          <div class="choix editions">${offres.map((o) => `
            <label><input type="radio" name="edition" value="${o.ed.id}" ${o === offre ? 'checked' : ''}>
              <strong>${esc(o.ed.nom)}</strong>
              <span class="small">${ic('calendrier')} du ${date(o.ed.date_debut)} au ${date(o.ed.date_fin)}</span>
              ${o.ed.lieu ? `<span class="small muted">${ic('lieu')} ${esc(o.ed.lieu)}</span>` : ''}</label>`).join('')}
          </div></fieldset>` : ''}

        <fieldset class="stack"><legend><span class="etape-num">${offres.length > 1 ? 2 : 1}</span> Vos informations</legend>
          <p class="small muted" style="margin:0">Elles figurent sur votre contrat et sont conservées pour vos prochaines réservations.</p>
          <div class="form-grid two">${CHAMPS.map(([k, l, req, ac]) => `
            <label${k === 'entreprise' ? ' class="pleine"' : ''}>${l}${req ? ' <span class="requis">*</span>' : ' <span class="hint">facultatif</span>'}
              <input name="${k}" value="${esc(profil[k] || '')}" ${req ? 'required' : ''} ${ac ? `autocomplete="${ac}"` : ''}
                ${k === 'email' ? 'type="email"' : k === 'whatsapp' ? 'type="tel" inputmode="tel"' : ''}></label>`).join('')}
          </div>
        </fieldset>

        <fieldset class="stack"><legend><span class="etape-num">${offres.length > 1 ? 3 : 2}</span> Votre stand</legend>
          <div id="stand"></div>
          <div class="form-grid two">
            <label>Nombre de stands
              <span class="quantite">
                <button type="button" class="btn secondary" data-q="-1" aria-label="Un stand de moins">−</button>
                <input name="quantite" type="number" min="1" max="50" value="1" inputmode="numeric" aria-label="Nombre de stands">
                <button type="button" class="btn secondary" data-q="1" aria-label="Un stand de plus">+</button>
              </span></label>
          </div>
          <div class="form-grid two">
            <label>Produits ou services à vendre <span class="requis">*</span> <span class="hint">Un par ligne. Ils figurent à l'article 6 du contrat.</span>
              <textarea name="produits" rows="4" placeholder="Jus naturels&#10;Pâtisseries"></textarea></label>
            <label>Équipements que vous apporterez <span class="hint">Facultatif, un par ligne</span>
              <textarea name="equipements" rows="4" placeholder="Réfrigérateur&#10;Présentoir"></textarea></label>
          </div>
          <label>Remarque pour l'organisation <span class="hint">Facultatif : besoins particuliers, préférences…</span>
            <textarea name="note" rows="2"></textarea></label>
          <div class="total" aria-live="polite"><span id="detail">Choisissez une catégorie</span><span class="value" id="total">—</span></div>
        </fieldset>

        <fieldset class="stack contrat-imprime"><legend><span class="etape-num">${offres.length > 1 ? 4 : 3}</span> Votre contrat</legend>
          <p class="small muted" style="margin:0">Il se remplit avec les informations ci-dessus. Relisez-le jusqu'au bout avant de l'accepter.</p>
          <div class="contrat-cadre" id="contrat" tabindex="0"></div>
          <label class="check"><input type="checkbox" name="accord" id="accord">
            <span id="texte-accord"></span></label>
        </fieldset>

        <div id="erreur" class="alert erreur" hidden></div>
        <button class="btn block lg" type="submit">${ic('valide')} Signer et envoyer ma demande</button>
      </form>`;

    const form = $('#form');
    const siteCourant = () => form.querySelector('[name=site]:checked')?.value || form.querySelector('[name=site]')?.value;
    const categorie = () => form.querySelector('[name=categorie]:checked');
    const quantite = () => Math.min(50, Math.max(1, parseInt(form.quantite.value, 10) || 1));

    function afficherStand() {
      const { ed, tarifs } = offre;
      const sites = ed.sites.filter((s) => tarifs.some((t) => t.site_id === s.id));
      const site = sites.some((s) => s.id === siteCourant()) ? siteCourant() : sites[0].id;
      const deja = categorie()?.value;
      const familles = [...new Set(tarifs.map((t) => t.famille_nom))];
      $('#stand').innerHTML = `
        ${sites.length > 1 ? `<div class="choix">${sites.map((s) => `<label><input type="radio" name="site" value="${s.id}" ${s.id === site ? 'checked' : ''}><strong>${esc(s.nom)}</strong></label>`).join('')}</div>`
          : `<input type="hidden" name="site" value="${site}">`}
        ${familles.map((f) => {
          const liste = tarifs.filter((t) => t.site_id === site && t.famille_nom === f);
          return liste.length ? `<div><h3 class="small muted">${esc(f)}</h3><div class="choix">${liste.map((t) => `
            <label><input type="radio" name="categorie" value="${t.categorie_id}" data-prix="${t.prix_unitaire}"
              data-nom="${esc(t.categorie_nom)}" ${t.categorie_id === deja ? 'checked' : ''}>
              <strong>${esc(t.categorie_nom)}</strong>
              <span>${fcfa(t.prix_unitaire)} <span class="muted small">/ stand</span></span><br>
              <span class="muted small">${esc(t.libelle)} jusqu'au ${date(t.date_fin)}</span></label>`).join('')}</div></div>` : '';
        }).join('')}`;
      $('#texte-accord').textContent =
        `J'ai lu le contrat d'exploitation des stands (version ${offre.contrat.version}) rempli à mon nom et j'en accepte toutes les conditions.`;
      majTotal();
      majContrat();
    }

    function majTotal() {
      const c = categorie();
      if (!c) { $('#detail').textContent = 'Choisissez une catégorie'; $('#total').textContent = '—'; return; }
      $('#detail').textContent = `${quantite()} × ${c.dataset.nom} à ${fcfa(c.dataset.prix)}`;
      $('#total').textContent = fcfa(quantite() * Number(c.dataset.prix));
    }

    // Aperçu du contrat avec les valeurs saisies
    function majContrat() {
      const c = categorie();
      const site = offre.ed.sites.find((s) => s.id === siteCourant());
      const v = (k) => form[k]?.value.trim() || null;
      const haut = $('#contrat').scrollTop;
      $('#contrat').innerHTML = documentContrat(offre.contrat, {
        nom: v('nom'), prenoms: v('prenoms'), entreprise: v('entreprise'), telephone: profil.telephone,
        adresse: v('adresse'), ville: v('ville'), ifu: v('ifu'), rccm: v('rccm'),
        edition: offre.ed.nom, lieu: offre.ed.lieu, date_debut: offre.ed.date_debut, date_fin: offre.ed.date_fin,
        site: site?.nom, categorie: c?.dataset.nom, quantite: c ? quantite() : null,
        prix_unitaire: c ? Number(c.dataset.prix) : null, montant: c ? quantite() * Number(c.dataset.prix) : null,
        produits: v('produits'), equipements: v('equipements'), date: new Date().toISOString(),
      });
      $('#contrat').scrollTop = haut;
      if (!estModele(offre.contrat)) $('#contrat').insertAdjacentHTML('afterbegin',
        '<p class="small muted" style="margin:0 0 8px">Ce contrat n\'a pas encore de champs automatiques : vos informations figurent dans votre demande.</p>');
    }

    afficherStand();
    let minuterie;
    form.addEventListener('input', (e) => {
      if (e.target.name === 'quantite') majTotal();
      clearTimeout(minuterie);
      minuterie = setTimeout(majContrat, 150);
    });
    form.addEventListener('change', (e) => {
      if (e.target.name === 'edition') { offre = offres.find((o) => o.ed.id === e.target.value); $('#accord').checked = false; return afficherStand(); }
      if (e.target.name === 'site') return afficherStand();
      majTotal(); majContrat();
    });
    $$('[data-q]').forEach((b) => b.addEventListener('click', () => {
      form.quantite.value = Math.min(50, Math.max(1, quantite() + Number(b.dataset.q)));
      majTotal(); majContrat();
    }));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const erreur = $('#erreur');
      erreur.hidden = true;
      const manque = CHAMPS.filter(([k, , req]) => req && !form[k].value.trim()).map(([, l]) => l.toLowerCase());
      const probleme =
        manque.length ? `Complétez : ${manque.join(', ')}.` :
        !categorie() ? 'Choisissez une catégorie de stand.' :
        !form.produits.value.trim() ? 'Indiquez les produits ou services que vous vendrez.' :
        !$('#accord').checked ? 'Cochez la case pour accepter le contrat.' : null;
      if (probleme) { erreur.textContent = probleme; erreur.hidden = false; erreur.scrollIntoView({ block: 'center' }); return; }

      const bouton = form.querySelector('[type=submit]');
      bouton.disabled = true;
      try {
        const champs = Object.fromEntries(CHAMPS.map(([k]) => [k, form[k].value]));
        if (champs.whatsapp) champs.whatsapp = normaliserTelephone(champs.whatsapp);
        if (CHAMPS.some(([k]) => (champs[k] || '') !== (profil[k] || ''))) profil = await api.majMonProfil(champs);
        const d = await api.creerDemande({
          edition_id: offre.ed.id, site_id: siteCourant(), categorie_id: categorie().value, quantite: quantite(),
          contrat_id: offre.contrat.id, consentement: true, note: form.note.value,
          produits: form.produits.value, equipements: form.equipements.value,
        });
        location.href = `/espace/demande.html?id=${d.id}&nouvelle=1`;
      } catch (err) {
        erreur.textContent = err.message; erreur.hidden = false;
        bouton.disabled = false;
      }
    });
  </script>
</body>
</html>
