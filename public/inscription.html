<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription · Fenou Expo Manage</title>
  <meta name="theme-color" content="#0f0f11">
  <link rel="stylesheet" href="/assets/css/app.css">
  <meta name="description" content="Réservez votre stand au marché Fènou HIGBÉ : inscription par téléphone, demande de stand, paiement en plusieurs fois et suivi en ligne.">
  <link rel="canonical" href="https://fenouexpo.pages.dev/inscription">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Fenou Expo Manage">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:url" content="https://fenouexpo.pages.dev/inscription">
  <meta property="og:title" content="Fènou HIGBÉ · Inscription des exposants">
  <meta property="og:description" content="Inscrivez-vous, demandez votre stand et payez en plusieurs fois. Tout se gère en ligne, depuis votre téléphone.">
  <meta property="og:image" content="https://fenouexpo.pages.dev/assets/img/site/partage.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fenou Expo">
  <script type="module" src="/assets/js/pwa.js"></script>
</head>
<body>
  <div class="auth">
    <section class="auth-visuel" id="visuel"></section>
    <section class="auth-form"><div>
      <h1>Créer mon compte</h1>
      <p class="sous-titre">Votre numéro et un mot de passe suffisent. Vous compléterez vos informations au moment de réserver votre stand.</p>

      <form id="form" class="form-grid" novalidate>
        <label>Numéro de téléphone <span class="hint">Il vous servira à vous connecter.</span>
          <span class="champ"><span data-ic="telephone"></span><input name="telephone" type="tel" inputmode="tel" required autocomplete="tel" placeholder="01 97 00 00 00"></span>
        </label>
        <label>Mot de passe <span class="hint">6 caractères minimum</span>
          <span class="champ"><span data-ic="cadenas"></span><input name="mdp" type="password" required minlength="6" autocomplete="new-password"></span>
        </label>
        <label>Confirmez le mot de passe
          <span class="champ"><span data-ic="cadenas"></span><input name="mdp2" type="password" required minlength="6" autocomplete="new-password"></span>
        </label>
        <div id="erreur" class="alert erreur" hidden></div>
        <button class="btn block lg" type="submit">Créer mon compte <span data-ic="fleche"></span></button>
      </form>
      <p class="small muted" style="margin-top:20px">Déjà exposant lors d'une édition précédente ? <a class="lien-fort" href="/connexion.html">Connectez-vous</a> : vos informations sont conservées.</p>
      <p class="small muted" style="margin-top:24px;text-align:center"><a href="/" style="color:inherit">← Retour à l'accueil</a></p>
    </div></section>
  </div>

  <script type="module">
    import * as api from '/assets/js/api.js';
    import { monterVisuel } from '/assets/js/auth-visuel.js';
    import { ic } from '/assets/js/icones.js';
    import { $, $$, lireFormulaire, telephoneValide } from '/assets/js/ui.js';

    monterVisuel($('#visuel'));
    $$('[data-ic]').forEach((s) => (s.outerHTML = ic(s.dataset.ic)));
    if (await api.monProfil()) location.replace('/espace/');

    const form = $('#form'), erreur = $('#erreur');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      erreur.hidden = true;
      const v = lireFormulaire(form);
      const probleme =
        !telephoneValide(v.telephone) ? 'Numéro de téléphone invalide.' :
        (v.mdp || '').length < 6 ? 'Le mot de passe doit contenir au moins 6 caractères.' :
        v.mdp !== v.mdp2 ? 'Les deux mots de passe ne sont pas identiques.' : null;
      if (probleme) { erreur.textContent = probleme; erreur.hidden = false; return; }

      const bouton = form.querySelector('[type=submit]');
      bouton.disabled = true;
      try {
        await api.inscription({ telephone: v.telephone }, v.mdp);
        location.href = '/espace/?bienvenue=1';
      } catch (err) {
        erreur.textContent = err.message;
        erreur.hidden = false;
        bouton.disabled = false;
      }
    });
  </script>
</body>
</html>
